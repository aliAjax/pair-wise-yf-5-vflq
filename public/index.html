<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社区药房 · 冷藏疫苗箱借还调度</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #1f2329; }
  header { background: #0b5cad; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header input { border: none; border-radius: 6px; padding: 6px 10px; }
  #toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: #1f7a3d; color: #fff;
           padding: 10px 18px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
  #toast.show { opacity: 1; }
  #toast.err { background: #c0392b; }
  #stats { display: flex; gap: 12px; padding: 16px 24px 0; flex-wrap: wrap; }
  .stat { background: #fff; border-radius: 10px; padding: 12px 20px; min-width: 130px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .stat .num { font-size: 26px; font-weight: 700; }
  .stat .lbl { color: #6b7280; font-size: 13px; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 24px 32px; align-items: start; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .card { background: #fff; border-radius: 10px; padding: 16px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { margin: 0 0 12px; font-size: 15px; }
  .card h2 small { color: #9ca3af; font-weight: 400; margin-left: 6px; }
  form.row { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select, textarea { border: 1px solid #d1d5db; border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit; }
  button, .btn { border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer;
                 background: #0b5cad; color: #fff; display: inline-block; }
  button:hover, .btn:hover { filter: brightness(1.1); }
  button.ghost { background: #e5e7eb; color: #374151; }
  button.danger { background: #c0392b; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eef0f3; vertical-align: top; }
  th { color: #6b7280; font-weight: 500; white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
  .b-idle     { background: #dcfce7; color: #15803d; }
  .b-issued   { background: #dbeafe; color: #1d4ed8; }
  .b-pending  { background: #fef3c7; color: #b45309; }
  .b-returned { background: #ede9fe; color: #6d28d9; }
  .b-exception{ background: #fee2e2; color: #b91c1c; }
  .b-quarantined, .b-cancelled { background: #e5e7eb; color: #4b5563; }
  .b-closed   { background: #d1fae5; color: #047857; }
  tr.row-exception { background: #fff5f5; }
  tr.row-review { background: #fffbeb; }
  .muted { color: #9ca3af; font-size: 12px; }
  .warn { color: #b91c1c; font-size: 12px; }
  .order { border: 1px solid #eef0f3; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .order .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .order .head b { font-size: 14px; }
  .order .body { margin-top: 8px; font-size: 13px; color: #4b5563; display: flex; flex-direction: column; gap: 4px; }
  .issue-bar { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  details { margin-top: 8px; }
  details summary { list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details .ret-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px;
                      background: #f8fafc; padding: 10px; border-radius: 8px; }
  .review-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .review-bar input { flex: 1; min-width: 140px; }
  .ev { display: flex; gap: 8px; font-size: 12.5px; padding: 6px 0; border-bottom: 1px dashed #eef0f3; }
  .ev .time { color: #9ca3af; white-space: nowrap; }
  .empty { color: #9ca3af; font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>
<header>
  <h1>社区药房 · 冷藏疫苗箱借还调度</h1>
  <label>操作人 <input id="actor" placeholder="姓名" size="8"></label>
</header>
<div id="toast"></div>
<section id="stats"></section>
<main>
  <div class="col">
    <section class="card">
      <h2>提交借箱单 <small>护士填写</small></h2>
      <form class="row" onsubmit="return submitOrder(event)">
        <input name="nurse" placeholder="护士姓名 *" required>
        <input name="vaccine" placeholder="疫苗品种/批次">
        <input name="requiredCapacity" type="number" min="1" step="1" placeholder="所需容量(L) *" required style="width:110px">
        <input name="note" placeholder="备注">
        <button type="submit">提交</button>
      </form>
    </section>
    <section class="card">
      <h2>借箱单 <small>待发放 → 在借 → 待复核 → 已结束</small></h2>
      <div id="orders"></div>
    </section>
  </div>
  <div class="col">
    <section class="card">
      <h2>冷藏箱库存与复核 <small>归还后须复核放行才能再次借出</small></h2>
      <div id="boxes"></div>
    </section>
    <section class="card">
      <h2>交接与复核记录 <small>每次交接时间、异常结论均留痕</small></h2>
      <div id="events"></div>
    </section>
  </div>
</main>
<script>
let state = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = iso => iso ? new Date(iso).toLocaleString('zh-CN', { hour12: false }) : '—';
const fmtDay = iso => iso ? new Date(iso).toLocaleDateString('zh-CN') : '—';

const ORDER_ST = { pending:['待发放','b-pending'], issued:['在借','b-issued'], returned:['待复核','b-returned'],
                   closed:['已结束','b-closed'], cancelled:['已取消','b-cancelled'] };
const BOX_ST = { idle:['可用','b-idle'], issued:['在借','b-issued'], pending_review:['待复核','b-pending'],
                 exception:['异常区','b-exception'], quarantined:['隔离中','b-quarantined'] };
const EV_LABEL = { order_submitted:'提交借箱单', box_issued:'发放交接', box_returned:'归还交接',
                   box_reviewed:'复核', order_cancelled:'取消借箱单' };

const actor = () => $('actor').value.trim();
$('actor').value = localStorage.getItem('actor') || '';
$('actor').addEventListener('change', () => localStorage.setItem('actor', $('actor').value));

let toastTimer;
function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3500);
}

async function api(path, method, body) {
  const res = await fetch(path, {
    method,
    headers: { 'content-type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const e = new Error(data.message || '请求失败');
    e.code = data.code; e.extra = data.extra;
    throw e;
  }
  return data;
}

async function refresh() {
  state = await api('/api/state', 'GET');
  render();
}

// 轮询重渲染时保留正在填写的输入与展开状态
function snapshot() {
  const vals = {};
  document.querySelectorAll('input[id], select[id]').forEach(el => { vals[el.id] = el.value; });
  const opens = new Set();
  document.querySelectorAll('details[open]').forEach(el => opens.add(el.id));
  return { vals, opens };
}
function restore(snap) {
  Object.entries(snap.vals).forEach(([id, v]) => { const el = $(id); if (el) el.value = v; });
  snap.opens.forEach(id => { const el = $(id); if (el) el.open = true; });
}

function render() {
  const snap = snapshot();
  renderStats();
  renderOrders();
  renderBoxes();
  renderEvents();
  restore(snap);
}

function renderStats() {
  const bs = state.boxes;
  const count = s => bs.filter(b => b.status === s).length;
  const review = count('pending_review');
  const exc = count('exception');
  $('stats').innerHTML = [
    [count('idle'), '可用箱'],
    [count('issued'), '在借'],
    [review, '待复核'],
    [exc, '异常区'],
  ].map(([n, l]) => `<div class="stat"><div class="num">${n}</div><div class="lbl">${l}</div></div>`).join('');
}

function boxCode(id) { const b = state.boxes.find(b => b.id === id); return b ? b.code : '—'; }

function renderOrders() {
  const orders = [...state.orders].sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  if (!orders.length) { $('orders').innerHTML = '<div class="empty">暂无借箱单</div>'; return; }
  $('orders').innerHTML = orders.map(o => {
    const [label, cls] = ORDER_ST[o.status];
    let action = '';
    if (o.status === 'pending') {
      const idle = state.boxes.filter(b => b.status === 'idle');
      const opts = idle.map(b => {
        const expired = new Date(b.disinfectValidUntil).getTime() < Date.now();
        const small = b.capacity < o.requiredCapacity;
        const dis = expired || small;
        const reason = expired ? '（消毒过期）' : small ? '（容量不足）' : '';
        return `<option value="${b.id}" ${dis ? 'disabled' : ''}>${esc(b.code)} · ${b.capacity}L · 消毒至 ${fmtDay(b.disinfectValidUntil)}${reason}</option>`;
      }).join('');
      action = `<div class="issue-bar">
        <select id="issue-${o.id}">${opts || '<option value="">暂无可用箱</option>'}</select>
        <button onclick="issueOrder('${o.id}')">确认发放</button>
        <button class="ghost" onclick="cancelOrder('${o.id}')">取消</button>
      </div>`;
    } else if (o.status === 'issued') {
      action = `<details id="ret-${o.id}">
        <summary class="btn">归还登记</summary>
        <div class="ret-form">
          <label>封条 <select id="seal-${o.id}"><option value="1">完好</option><option value="0">破损</option></select></label>
          <label>温度(℃) <input id="temp-${o.id}" type="number" step="0.1" size="5" placeholder="${state.constants.TEMP_MIN}~${state.constants.TEMP_MAX}"></label>
          <label>重量(kg) <input id="weight-${o.id}" type="number" step="0.01" size="5"></label>
          <button onclick="returnOrder('${o.id}')">确认归还</button>
        </div>
      </details>`;
    }
    const lines = [];
    lines.push(`需 ${o.requiredCapacity}L` + (o.vaccine ? ` · 疫苗：${esc(o.vaccine)}` : '') + (o.note ? ` · 备注：${esc(o.note)}` : ''));
    lines.push(`<span class="muted">提交 ${fmt(o.createdAt)}</span>`);
    if (o.issuedAt) lines.push(`<span class="muted">发放 ${fmt(o.issuedAt)} · 箱 ${esc(boxCode(o.boxId))}</span>`);
    if (o.returnRecord) {
      const r = o.returnRecord;
      lines.push(`<span class="muted">归还 ${fmt(r.at)} · 封条${r.sealIntact ? '完好' : '破损'} · ${r.temperature}℃ · ${r.weight}kg</span>` +
        (r.abnormalReasons.length ? ` <span class="warn">异常：${r.abnormalReasons.join('、')}</span>` : ''));
    }
    if (o.status === 'returned') lines.push('<span class="muted">等待复核，复核放行前该箱不得再借</span>');
    if (o.status === 'closed') {
      lines.push(`<span class="muted">结束 ${fmt(o.closedAt)} · 复核${o.reviewDecision === 'release' ? '放行' : '确认异常'}${o.reviewConclusion ? '：' + esc(o.reviewConclusion) : ''}</span>`);
    }
    return `<div class="order">
      <div class="head"><b>${o.id}</b><span class="badge ${cls}">${label}</span><span>${esc(o.nurse)}</span></div>
      <div class="body">${lines.map(l => `<div>${l}</div>`).join('')}</div>
      ${action}
    </div>`;
  }).join('');
}

function renderBoxes() {
  const rows = state.boxes.map(b => {
    const [label, cls] = BOX_ST[b.status];
    const expired = new Date(b.disinfectValidUntil).getTime() < Date.now();
    let extra = '';
    if (b.lastReturn) {
      const r = b.lastReturn;
      extra += `<div class="muted">归还 ${fmt(r.at)} · 封条${r.sealIntact ? '完好' : '破损'} · ${r.temperature}℃ · ${r.weight}kg</div>`;
      if (r.abnormalReasons.length) extra += `<div class="warn">异常：${r.abnormalReasons.join('、')}</div>`;
    }
    if (b.lastReview) {
      extra += `<div class="muted">复核 ${fmt(b.lastReview.at)} · ${b.lastReview.decision === 'release' ? '放行' : '隔离'}${b.lastReview.conclusion ? '：' + esc(b.lastReview.conclusion) : ''}</div>`;
    }
    if (['pending_review', 'exception', 'quarantined'].includes(b.status)) {
      extra += `<div class="review-bar">
        <input id="conc-${b.id}" placeholder="复核结论（隔离必填）">
        <button onclick="reviewBox('${b.id}','release')">复核放行</button>
        ${b.status !== 'quarantined' ? `<button class="danger" onclick="reviewBox('${b.id}','quarantine')">确认异常·隔离</button>` : ''}
      </div>`;
    }
    const rowCls = b.status === 'exception' ? 'row-exception' : (b.status === 'pending_review' ? 'row-review' : '');
    return `<tr class="${rowCls}">
      <td><b>${esc(b.code)}</b></td>
      <td>${b.capacity}L</td>
      <td>${fmtDay(b.disinfectValidUntil)}${expired ? ' <span class="warn">已过期</span>' : ''}</td>
      <td><span class="badge ${cls}">${label}</span></td>
      <td>${b.currentOrderId || '—'}</td>
      <td>${extra || '<span class="muted">—</span>'}</td>
    </tr>`;
  }).join('');
  $('boxes').innerHTML = `<table>
    <thead><tr><th>编号</th><th>容量</th><th>消毒有效期至</th><th>状态</th><th>关联单</th><th>归还记录 / 复核</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function renderEvents() {
  const evs = [...state.events].reverse().slice(0, 50);
  if (!evs.length) { $('events').innerHTML = '<div class="empty">暂无记录</div>'; return; }
  $('events').innerHTML = evs.map(e => `<div class="ev">
    <span class="time">${fmt(e.time)}</span>
    <span><b>${EV_LABEL[e.type] || e.type}</b>
    ${e.orderId ? `单 ${e.orderId} ` : ''}${e.boxId ? `箱 ${esc(boxCode(e.boxId))} ` : ''}
    ${e.actor ? `· ${esc(e.actor)} ` : ''}· ${esc(e.detail)}</span>
  </div>`).join('');
}

async function submitOrder(ev) {
  ev.preventDefault();
  const f = ev.target;
  try {
    await api('/api/orders', 'POST', {
      nurse: f.nurse.value, vaccine: f.vaccine.value,
      requiredCapacity: Number(f.requiredCapacity.value), note: f.note.value,
    });
    f.reset();
    toast('借箱单已提交');
  } catch (e) { toast(e.message, true); }
  await refresh();
  return false;
}

async function issueOrder(orderId) {
  const sel = $('issue-' + orderId);
  const boxId = sel && sel.value;
  if (!boxId) return toast('请选择要发放的冷藏箱', true);
  try {
    await api(`/api/orders/${orderId}/issue`, 'POST', { boxId, actor: actor() });
    toast('已确认发放，该箱已被占用');
  } catch (e) {
    if (e.code === 'BOX_UNAVAILABLE') {
      const avail = (e.extra && e.extra.availableBoxes || []).map(b => b.code).join('、') || '无';
      toast(`该箱刚被其他借单占用，请改派。当前可用箱：${avail}`, true);
    } else {
      toast(e.message, true);
    }
  }
  await refresh();
}

async function returnOrder(orderId) {
  const sealIntact = $('seal-' + orderId).value === '1';
  const temperature = Number($('temp-' + orderId).value);
  const weight = Number($('weight-' + orderId).value);
  try {
    const r = await api(`/api/orders/${orderId}/return`, 'POST', { sealIntact, temperature, weight, actor: actor() });
    const abnormal = r.box.status === 'exception';
    toast(abnormal ? '已归还：存在异常，转入异常区待复核' : '已归还，待复核', abnormal);
  } catch (e) { toast(e.message, true); }
  await refresh();
}

async function reviewBox(boxId, decision) {
  const conclusion = $('conc-' + boxId).value;
  try {
    await api(`/api/boxes/${boxId}/review`, 'POST', { decision, conclusion, actor: actor() });
    toast(decision === 'release' ? '已复核放行，可再次借出' : '已确认异常并隔离');
  } catch (e) { toast(e.message, true); }
  await refresh();
}

async function cancelOrder(orderId) {
  try {
    await api(`/api/orders/${orderId}/cancel`, 'POST', { actor: actor() });
    toast('借箱单已取消');
  } catch (e) { toast(e.message, true); }
  await refresh();
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
